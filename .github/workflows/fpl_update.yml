
name: FPL Weekly Data Update

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-fpl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect FPL data
        run: python collect_fpl.py

      - name: Save updated data
        run: |
          git config user.name "FPL Data Bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/fpl_data.json data/fpl_summary.json data/fpl_player_pool.json

          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update FPL data"
            git push
          fi
